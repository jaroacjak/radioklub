<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moderátori – Rádio Klub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d0d16;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: auto;
            padding: 50px 0;
        }

        h1 {
            text-align: center;
            font-size: 48px;
            margin-bottom: 45px;
        }

        .moderatori {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(250px, 1fr)
            );
            gap: 30px;
        }

        .moderator {
            background: #181824;
            border: 1px solid #292938;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
        }

        .foto {
            width: 200px;
            height: 200px;
            margin: 0 auto 25px;

            border-radius: 50%;
            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #6c2cff,
                    #d51cff
                );
        }

        .foto img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .foto-placeholder {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 60px;
        }

        .moderator h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .moderator p {
            color: #d51cff;
            font-weight: bold;
            line-height: 1.5;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            .foto {
                width: 170px;
                height: 170px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <h1>Moderátori</h1>

        <div class="moderatori">

            <!-- JARKO AČJAK -->

            <div class="moderator">

                <div class="foto">

                    <div class="foto-placeholder">
                        🎙️
                    </div>

                </div>

                <h2>
                    Jarko Ačjak
                </h2>

                <p>
                    Majiteľ Rádio Klub<br>
                    Moderátor
                </p>

            </div>


            <!-- JAKUB BREZANI -->

            <div class="moderator">

                <div class="foto">

                    <div class="foto-placeholder">
                        🎙️
                    </div>

                </div>

                <h2>
                    Jakub Brezani
                </h2>

                <p>
                    Moderátor
                </p>

            </div>


            <!-- LEO KOVAČKA -->

            <div class="moderator">

                <div class="foto">

                    <div class="foto-placeholder">
                        🎧
                    </div>

                </div>

                <h2>
                    Leo Kovačka
                </h2>

                <p>
                    DJ
                </p>

            </div>

        </div>

    </main>

</body>
</html>
