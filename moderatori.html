<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Moderátori – Rádio Klub</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0d0d16;
            color: white;
            min-height: 100vh;
        }

        /* HLAVIČKA */

        header {
            background: linear-gradient(135deg, #6c2cff, #d51cff);

            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo-link {
            display: flex;
            align-items: center;

            color: white;
            text-decoration: none;
        }

        .logo-image {
            width: 55px;
            height: 55px;

            object-fit: cover;
            border-radius: 50%;

            margin-right: 12px;

            border: 2px solid rgba(255,255,255,0.4);
        }

        .logo-text {
            font-size: 28px;
            font-weight: bold;
        }

        /* MENU */

        nav {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;

            margin-left: 22px;

            font-weight: bold;

            padding-bottom: 6px;

            border-bottom: 3px solid transparent;

            transition: 0.2s;
        }

        nav a:hover {
            opacity: 0.7;
        }

        nav a.active {
            border-bottom: 3px solid white;
            opacity: 1;
        }

        /* HLAVNÁ SEKCIA */

        .hero {
            min-height: 45vh;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at center,
                    #30205c 0%,
                    #0d0d16 65%
                );
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: clamp(50px, 8vw, 80px);
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #d51cff;
        }

        .hero p {
            font-size: 20px;
            color: #bbb;
        }

        /* MODERÁTORI */

        .moderatori-section {
            padding: 80px 8%;
        }

        .moderatori {
            max-width: 1100px;
            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(240px, 1fr)
                );

            gap: 25px;
        }

        /* KARTA */

        .moderator-card {
            background: #181824;

            padding: 30px 25px;

            border-radius: 20px;

            border: 1px solid #292938;

            text-align: center;

            transition: 0.2s;
        }

        .moderator-card:hover {
            transform: translateY(-7px);

            border-color: #8b45ff;
        }

        /* FOTKA */

        .moderator-photo {
            width: 200px;
            height: 200px;

            margin: 0 auto 25px;

            border-radius: 50%;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #6c2cff,
                    #d51cff
                );

            border:
                4px solid
                rgba(255,255,255,0.12);

            box-shadow:
                0 0 35px
                rgba(213,28,255,0.3);

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .moderator-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .placeholder {
            font-size: 60px;
        }

        /* TEXT */

        .moderator-card h2 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .moderator-card p {
            color: #d51cff;

            font-weight: bold;

            line-height: 1.5;
        }

        /* FOOTER */

        footer {
            text-align: center;

            padding: 35px;

            background: #090910;

            color: #777;
        }

        .social {
            margin-top: 15px;
        }

        .social a {
            color: #d51cff;

            text-decoration: none;

            margin: 0 10px;
        }

        .social a:hover {
            color: white;
        }

        /* MOBIL */

        @media (max-width: 850px) {

            header {
                flex-direction: column;
                gap: 15px;
            }

            nav {
                justify-content: center;
            }

            nav a {
                margin: 5px 8px;
            }
        }

        @media (max-width: 600px) {

            .hero h1 {
                font-size: 55px;
            }

            .moderator-photo {
                width: 175px;
                height: 175px;
            }

            .logo-text {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>
