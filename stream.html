<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rádio Klub – Prehrávač</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at top,
                    #5120a0,
                    #0d0d16 70%
                );
        }

        .player {
            width: 90%;
            max-width: 430px;

            padding: 40px 30px;

            text-align: center;

            background: rgba(24, 24, 36, 0.95);

            border: 1px solid rgba(255, 255, 255, 0.1);

            border-radius: 30px;

            box-shadow:
                0 20px 70px
                rgba(0, 0, 0, 0.6);
        }

        /* LOGO */

        .logo-link {
            display: block;
            width: 130px;
            height: 130px;

            margin: 0 auto 25px;

            text-decoration: none;
        }

        .logo {
            width: 130px;
            height: 130px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 55px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #6c2cff,
                    #d51cff
                );

            box-shadow:
                0 0 40px
                rgba(213, 28, 255, 0.5);

            transition: 0.2s;
        }

        .logo:hover {
            transform: scale(1.08);
        }

        h1 {
            font-size: 34px;
            margin-bottom: 10px;
        }

        .status {
            color: #aaa;
            margin-bottom: 30px;
        }

        .status span {
            color: #ff2d55;
        }

        /* OVLÁDANIE */

        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;

            margin-bottom: 25px;
        }

        .play-button {
            width: 90px;
            height: 90px;

            border: none;
            border-radius: 50%;

            font-size: 30px;

            cursor: pointer;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6c2cff,
                    #d51cff
                );

            transition: 0.2s;

            box-shadow:
                0 10px 35px
                rgba(108, 44, 255, 0.5);
        }

        .play-button:hover {
            transform: scale(1.08);
        }

        /* GOOGLE CAST */

        .cast-button {
            width: 50px;
            height: 50px;

            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;

            background: #252535;

            color: white;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            transition: 0.2s;
        }

        .cast-button:hover {
            background: #353550;
            transform: scale(1.08);
        }

        .cast-button svg {
            width: 25px;
            height: 25px;
            fill: currentColor;
        }

        /* HLASITOSŤ */

        .volume-box {
            margin-top: 25px;
            text-align: left;
        }

        .volume-box label {
            display: block;
            margin-bottom: 10px;
            color: #aaa;
        }

        input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* PRÁVE HRÁ */

        .now-playing {
            margin-top: 30px;
            padding: 20px;

            border-radius: 15px;

            background: #11111b;
        }

        .now-playing small {
            color: #888;
            font-size: 11px;
            letter-spacing: 1px;
        }

        .now-playing p {
            margin-top: 10px;
            font-weight: bold;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading {
            color: #888;
        }

    </style>
</head>

<body>

    <div class="player">

        <!-- LOGO S ODKAZOM -->

        <a
            class="logo-link"
            href="https://mytuner-radio.com/radio/radio-klub-513497/"
            target="_blank"
            title="Otvoriť Rádio Klub na myTuner"
        >
            <div class="logo">
                🎧
            </div>
        </a>


        <!-- NÁZOV -->

        <h1>Rádio Klub</h1>


        <!-- STATUS -->

        <p class="status">
            <span>●</span> Živé vysielanie
        </p>


        <!-- OVLÁDANIE -->

        <div class="controls">

            <!-- PLAY / PAUSE -->

            <button
                class="play-button"
                id="playButton"
                onclick="toggleRadio()"
                title="Prehrať rádio"
            >
                ▶
            </button>


            <!-- GOOGLE CAST - PRIPRAVENÉ NA DOKONČENIE -->

            <button
                class="cast-button"
                id="castButton"
                onclick="startCast()"
                title="Google Cast"
            >

                <svg viewBox="0 0 24 24">
                    <path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.92-11-11-11zM3 3h18v14h-2V5H3V3z"/>
                </svg>

            </button>

        </div>


        <!-- RÁDIO STREAM -->

        <audio id="radioPlayer">
            <source
                src="https://listen.radioking.com/radio/917921/stream/988836"
                type="audio/mpeg"
            >
        </audio>


        <!-- HLASITOSŤ -->

        <div class="volume-box">

            <label for="volume">
                🔊 Hlasitosť
            </label>

            <input
                type="range"
                id="volume"
                min="0"
                max="1"
                step="0.01"
                value="0.8"
            >

        </div>


        <!-- PRÁVE HRÁ -->

        <div class="now-playing">

            <small>
                PRÁVE HRÁ
            </small>

            <p
                id="songName"
                class="loading"
            >
                Načítavam aktuálnu skladbu...
            </p>

        </div>

    </div>


    <script>

        /*
        ==============================
        NASTAVENIA
        ==============================
        */

        const STREAM_URL =
            "https://listen.radioking.com/radio/917921/stream/988836";

        const METADATA_API =
            "https://api.radioking.io/widget/radio/radioklubslovak/track/current?format=text";


        /*
        ==============================
        ELEMENTY
        ==============================
        */

        const radio =
            document.getElementById("radioPlayer");

        const playButton =
            document.getElementById("playButton");

        const volume =
            document.getElementById("volume");

        const songName =
            document.getElementById("songName");


        let playing = false;


        /*
        ==============================
        PLAY / PAUSE
        ==============================
        */

        function toggleRadio() {

            if (!playing) {

                radio.play()

                    .then(() => {

                        playing = true;

                        playButton.innerHTML = "❚❚";

                        playButton.title =
                            "Pozastaviť rádio";

                    })

                    .catch((error) => {

                        console.error(error);

                        alert(
                            "Nepodarilo sa spustiť rádio."
                        );

                    });

            } else {

                radio.pause();

                playing = false;

                playButton.innerHTML = "▶";

                playButton.title =
                    "Prehrať rádio";

            }

        }


        /*
        ==============================
        HLASITOSŤ
        ==============================
        */

        radio.volume = volume.value;

        volume.addEventListener(
            "input",
            function () {

                radio.volume =
                    volume.value;

            }
        );


        /*
        ==============================
        AKTUÁLNA SKLADBA
        ==============================
        */

        async function updateMetadata() {

            try {

                const response =
                    await fetch(
                        METADATA_API
                    );

                if (!response.ok) {
                    throw new Error(
                        "Metadata API neodpovedá"
                    );
                }

                const text =
                    await response.text();

                if (
                    text &&
                    text.trim().length > 0
                ) {

                    songName.textContent =
                        text.trim();

                    songName.classList.remove(
                        "loading"
                    );

                } else {

                    songName.textContent =
                        "Rádio Klub – Živé vysielanie";

                }

            } catch (error) {

                console.error(
                    "Chyba metadata:",
                    error
                );

                songName.textContent =
                    "Rádio Klub – Živé vysielanie";

            }

        }


        /*
        Načíta metadata hneď
        */

        updateMetadata();


        /*
        Obnovuje aktuálnu skladbu
        každých 15 sekúnd
        */

        setInterval(
            updateMetadata,
            15000
        );


        /*
        ==============================
        GOOGLE CAST
        ==============================

        Tlačidlo a ikona sú pripravené.

        Ďalší krok bude pripojenie
        Google Cast SDK a odoslanie
        STREAM_URL do Chromecast zariadenia.
        */

        function startCast() {

            alert(
                "Google Cast funkciu teraz dokončíme."
            );

        }

    </script>

</body>
</html>
